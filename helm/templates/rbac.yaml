{{- if and .Values.springCloudKubernetes.enabled .Values.springCloudKubernetes.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oomlet.fullname" . }}-config
  labels:
    {{- include "oomlet.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oomlet.fullname" . }}-config
  labels:
    {{- include "oomlet.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oomlet.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oomlet.fullname" . }}-config
{{- end }}
